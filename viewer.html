<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Visor de pruebas de los modelos 3D de Dyson Air Studio." />
    <title>Dyson Air Studio — Visor 3D</title>
    <link rel="icon" type="image/svg+xml" href="/assets/logo.svg" />
  </head>
  <body>
    <main class="studio-shell">
      <header class="studio-header">
        <p class="eyebrow">DYSON AIR STUDIO</p>
        <h1>Co-anda2x™ <span>visor de modelos</span></h1>
        <a class="back-link" href="./index.html#hero">Volver al Hero</a>
      </header>

      <section class="viewer" aria-label="Visor 3D interactivo del producto">
        <div id="scene-container"></div>
        <div class="attachment-selector" role="group" aria-label="Seleccionar accesorio">
          <p class="selector-label">Accesorio</p>
          <div class="selector-options">
            <button class="attachment-option is-active" type="button" data-attachment="curling" aria-pressed="true">Rizador</button>
            <button class="attachment-option" type="button" data-attachment="fastDryer" aria-pressed="false">Secador</button>
            <button class="attachment-option" type="button" data-attachment="roundBrush" aria-pressed="false">Cepillo</button>
            <button class="attachment-option" type="button" data-attachment="airSmooth" aria-pressed="false">AirSmooth</button>
          </div>
          <span id="attachment-status" class="sr-only" aria-live="polite">Rizador conectado</span>
        </div>
        <p class="interaction-hint" aria-hidden="true">Arrastra para rotar · Pellizca para acercar</p>
        <button id="reset-view" class="reset-button" type="button" aria-label="Restablecer vista 3D">Restablecer vista</button>
      </section>
    </main>
    <script type="module" src="/src/viewer.js"></script>
  </body>
</html>
